# Shelf sync settings. Edit this file on the Kobo — the scripts never need changing.
#
# SHELF_URL must be the Mac's address on your network, not localhost: on the Kobo,
# localhost means the Kobo. Find it on the Mac with:
#
#     ipconfig getifaddr en0        (or en1 if Wi-Fi is on that interface)
#
# A DHCP lease can move, and then this stops working with a connection error. If that
# keeps happening, give the Mac a fixed address in your router's DHCP reservations.
SHELF_URL="http://192.168.1.12:3000/api/kobo/sync"
SHELF_TOKEN="PASTE_TOKEN_FROM_SHELF_SETTINGS"
