# Shelf sync settings.
#
# Only the token is required. Shelf is found on its own: the script tries the address that
# worked last time, then the hint below if you set one, then walks the network this Kobo is
# already on. Whatever answers is remembered, so a DHCP lease that moves fixes itself.
#
# Create the token in Shelf under Settings.
SHELF_TOKEN="PASTE_TOKEN_FROM_SHELF_SETTINGS"

# Optional. A starting guess, which saves a scan the first time. Find it on the Mac with
# `ipconfig getifaddr en0`. Leave it empty and discovery handles it.
SHELF_HOST=""

# Optional. Only if you run Shelf on a different port.
SHELF_PORT="3000"

# How often the background helper checks both sides, in seconds.
SHELF_INTERVAL="60"
