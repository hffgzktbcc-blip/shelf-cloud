# Copy this file to /mnt/onboard/.adds/nm/ on the Kobo.
# Put your token in shelf-sync.conf first.
#
# 9500 is how long NickelMenu waits for output. Its own documentation puts a hard ceiling
# on this - "0 < t < 10000" - and anything above it is rejected with "invalid timeout"
# before the script runs at all. The sweep is bounded to finish inside this window.
menu_item:main:Start Shelf automatic sync:cmd_spawn:quiet:/mnt/onboard/.adds/shelf-sync/shelf-sync.sh
menu_item:main:Stop Shelf automatic sync:cmd_output:2000:quiet:/mnt/onboard/.adds/shelf-sync/shelf-sync.sh stop
menu_item:main:Shelf sync now:cmd_output:9500:quiet:/mnt/onboard/.adds/shelf-sync/shelf-sync.sh once
menu_item:main:Shelf last sync log:cmd_output:2000:quiet:tail -n 20 /mnt/onboard/.adds/shelf-sync/last-error.log
